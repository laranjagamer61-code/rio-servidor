name: Compilar rio.pwn

on:
  push:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar seu codigo
        uses: actions/checkout@v4

      - name: Instalar biblioteca 32 bits
        run: sudo apt-get update && sudo apt-get install -y libc6-i386

      - name: Baixar pawncc pronto do open.mp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mkdir -p pawn
          gh release download --repo openmultiplayer/compiler --pattern '*linux*' --dir pawn
          cd pawn
          for f in *.tar.gz; do tar xzf "$f"; done
          for f in *.zip; do unzip -o "$f"; done
          cd ..
          find pawn -type f | head -n 30

      - name: Baixar includes do open.mp
        run: git clone --depth 1 https://github.com/openmultiplayer/omp-stdlib

      - name: Compilar
        run: |
          PAWNCC=$(find "$PWD/pawn" -name pawncc -type f | head -n 1)
          LIBPAWNC=$(find "$PWD/pawn" -name 'libpawnc.so*' | head -n 1)
          echo "Usando: $PAWNCC"
          echo "Biblioteca: $LIBPAWNC"
          chmod +x "$PAWNCC"
          export LD_LIBRARY_PATH="$(dirname "$LIBPAWNC"):$(dirname "$PAWNCC")"
          mkdir -p saida
          "$PAWNCC" rio_corrigido.pwn -i omp-stdlib -o saida/rio.amx

      - name: Guardar o rio.amx
        uses: actions/upload-artifact@v4
        with:
          name: rio-amx
          path: saida/rio.amx
